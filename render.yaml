services:
  - type: web
    name: ai-ecommerce-bot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ecommerce-db
          property: connectionString
      - key: AI_DEMO_MODE
        value: "true"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: AI_MODEL
        value: "gpt-4o-mini"

databases:
  - name: ai-ecommerce-db
    plan: free
